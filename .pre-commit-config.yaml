default_install_hook_types: [pre-commit, commit-msg]

ci:
  autoupdate_commit_msg: "chore(deps): update pre-commit hook versions"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-added-large-files
      - id: end-of-file-fixer
        exclude: ^xmake-requires\.lock$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        args: [--style=file]
        types_or: [file]
        files: \.(h|hpp|c|cpp)$
        exclude: ^lib/

  - repo: https://github.com/JohnnyMorganz/stylua
    rev: v2.5.2
    hooks:
      - id: stylua
        args: ["--config-path", "stylua.toml"]
        files: \.(lua)$
        exclude: ^lib/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies: ["prettier@3.1.0"]
        files: \.(json|md|yml|yaml)$
        exclude: ^(lib/|tests/fixtures/)

  # Commits are Conventional Commits (semantic-release reads them to pick the version), so reject anything else before it lands.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            feat,
            fix,
            perf,
            refactor,
            docs,
            style,
            test,
            build,
            ci,
            chore,
            revert,
          ]
