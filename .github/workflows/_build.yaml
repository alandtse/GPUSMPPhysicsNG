# Reusable build: compiles GPUSMPPhysicsNG.dll with xmake (releasedbg), runs the Catch2 suite, and uploads
# the binaries, shaders and prebuilt shader cache as an artifact. Called by build.yaml (CI) and release.yaml
# (packaging), so the toolchain is defined in exactly one place.
name: "_build"

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name for the uploaded binaries artifact."
        type: string
        default: GPUSMPPhysicsNG-binaries
      ref:
        description: "Git ref to build. Empty = the triggering commit (CI default)."
        type: string
        default: ""
    outputs:
      artifact-name:
        description: "Artifact name the binaries were uploaded under."
        value: ${{ inputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test (xmake, releasedbg)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # CommonLibSSE-NG/VR itself is compiled in-tree (not a cached package), but
      # its xmake-resolved deps (fmt, spdlog, â€¦) plus imgui / openvr / toml++ /
      # directxtk are â€” cache them keyed on the lockfile so only a dep bump
      # invalidates the cache.
      - name: Cache xmake packages
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake/packages
            ~/AppData/Local/.xmake/cache
          key: xmake-${{ runner.os }}-${{ hashFiles('xmake-requires.lock') }}
          restore-keys: |
            xmake-${{ runner.os }}-

      - name: Update xmake package repo
        run: xmake repo --update

      - name: Configure
        run: xmake config --mode=releasedbg --yes --verbose

      - name: Build
        run: xmake build --yes GPUSMPPhysicsNG

      - name: Build tests
        run: xmake build --yes GPUSMPPhysicsNG-Tests

      # The suite compiles the solver kernels through the plugin's own shader path (WARP, no GPU needed), so
      # the same run fills the blob cache the release ships. It is keyed by content hash, so it only serves
      # these exact shader bytes; the staged Shaders folder below is what the cache was built against.
      - name: Test (and fill the shader cache)
        shell: pwsh
        env:
          GPUSMP_SHADER_CACHE_DIR: ${{ github.workspace }}/staging/ShaderCache
        run: |
          New-Item -ItemType Directory -Force -Path staging/ShaderCache | Out-Null
          xmake run GPUSMPPhysicsNG-Tests

      - name: Stage binaries
        shell: pwsh
        run: |
          $out = "build/windows/x64/releasedbg"
          Copy-Item "$out/GPUSMPPhysicsNG.dll" staging/
          Copy-Item "$out/GPUSMPPhysicsNG.pdb" staging/
          Copy-Item shaders staging/Shaders -Recurse

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: staging
          if-no-files-found: error
