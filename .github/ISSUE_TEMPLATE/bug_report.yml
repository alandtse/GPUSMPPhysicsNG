name: Bug report
description: Something crashed, misbehaved, or hair or cloth is wrong
labels: [bug]
body:
  - type: dropdown
    id: runtime
    attributes:
      label: Game runtime
      options:
        - Skyrim SE (1.5.97)
        - Skyrim AE (1.6.x)
        - Skyrim VR (1.4.15)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GPUSMPPhysicsNG version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >
        What you did, what you expected, what you saw. For hair or cloth that
        misbehaves, name the armor or hair mod and its physics (XML) file.
    validations:
      required: true
  - type: textarea
    id: pluginlog
    attributes:
      label: GPUSMPPhysicsNG.log
      description: >
        From `Documents/My Games/<game>/SKSE/`. It lists every physics file this
        plugin claimed or declined, and why.
      render: text
  - type: textarea
    id: crashlog
    attributes:
      label: Crash log (if it crashed)
      description: >
        The matching `crash-*.log` from CrashLoggerSSE / Trainwreck, same
        folder. Paste the whole file or attach it.
      render: text
  - type: input
    id: mods
    attributes:
      label: Related mods
      description: hdtSMP64 build, other physics or skeleton mods, ENB or Community Shaders in your load order.
